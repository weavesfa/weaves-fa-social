
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weaves FA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            font-family: Arial, Helvetica, sans-serif;

            background:
                url("fond-violet.png")
                center center / cover fixed no-repeat;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 40px 28px;

            text-align: center;

            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 18px;

            box-shadow: 0 12px 40px rgba(35, 10, 54, 0.18);
        }

        .welcome {
            color: #7135a1;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        h1 {
            color: #281936;
            font-size: 38px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #66576f;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .links a {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px;

            background: white;
            border: 1px solid #e7dced;
            border-radius: 10px;

            color: #542477;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;

            transition: 0.2s;
        }

        .links a:hover {
            background: #f8f1fc;
            border-color: #c9a9df;
        }

        .arrow {
            color: #9b79b0;
            font-size: 20px;
        }

        footer {
            margin-top: 30px;
            color: #887991;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            body {
                background-attachment: scroll;
            }

            .container {
                padding: 32px 22px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <p class="welcome">BIENVENUE</p>

        <h1>Weaves FA</h1>

        <p class="subtitle">TOUT NOS LIENS</p>

        <nav class="links">

            <!-- BOUTIQUE -->
            <a href="https://exemple.com"
               target="_blank"
               rel="noopener noreferrer">
                <span>Boutique</span>
                <span class="arrow">↗</span>
            </a>

            <!-- TIKTOK -->
            <a href="https://www.tiktok.com/"
               target="_blank"
               rel="noopener noreferrer">
                <span>TikTok</span>
                <span class="arrow">↗</span>
            </a>

            <!-- YOUTUBE -->
            <a href="https://www.youtube.com/"
               target="_blank"
               rel="noopener noreferrer">
                <span>YouTube</span>
                <span class="arrow">↗</span>
            </a>

        </nav>

        <footer>
            © 2026 · Tous droits réservés
        </footer>

    </main>

</body>
</html>

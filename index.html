
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weaves FA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #080808;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 40px 28px;
            text-align: center;
            background: #111111;
            border: 1px solid #29202f;
            border-radius: 12px;
        }

        .welcome {
            color: #a879cf;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        h1 {
            color: #ffffff;
            font-size: 38px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #b9a9c5;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .links a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 19px 20px;

            background: #19151d;
            border: 1px solid #49345a;
            border-radius: 8px;

            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;

            transition: background 0.2s, border-color 0.2s;
        }

        .links a:hover {
            background: #261b30;
            border-color: #a879cf;
        }

        .arrow {
            color: #b98cdb;
            font-size: 19px;
        }

        footer {
            margin-top: 30px;
            color: #777777;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 22px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <p class="welcome">BIENVENUE</p>

        <h1>Weaves FA</h1>

        <p class="subtitle">TOUT NOS LIENS</p>

        <nav class="links">

            <a href="https://weaves-fa.everfront.store/"
               target="_blank"
               rel="noopener noreferrer">
                <span>Boutique</span>
                <span class="arrow">↗</span>
            </a>

            <a href="https://www.tiktok.com/@weavesfa5"
               target="_blank"
               rel="noopener noreferrer">
                <span>TikTok</span>
                <span class="arrow">↗</span>
            </a>

            <a href="https://www.youtube.com/"
               target="_blank"
               rel="noopener noreferrer">
                <span>YouTube</span>
                <span class="arrow">↗</span>
            </a>

        </nav>

        <footer>
            © 2026 · Tous droits réservés
        </footer>

    </main>

</body>
</html>
